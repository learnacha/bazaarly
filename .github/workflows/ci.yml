name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: build
    # One shared test database: run e2e jobs one at a time so parallel PRs don't race on stock.
    concurrency:
      group: e2e-test-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: '3100'
      BASE_URL: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # A dedicated test database (a Neon branch named ci), never the dev one.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run build

      - name: Start the app
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          node server/index.js --prod > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "$BASE_URL/api/health" >/dev/null && exit 0
            sleep 1
          done
          echo "App did not become healthy"; cat server.log; exit 1

      - name: API smoke test
        run: npm run smoke

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # BASE_URL is set, so Playwright uses the server started above instead of starting its own.
      - name: UI tests
        run: npm run e2e

      - name: Test summary
        if: always()
        run: |
          if [ -f e2e-results/results.json ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("e2e-results/results.json", "utf8")).stats;
              const t = (r.expected||0) + (r.unexpected||0) + (r.flaky||0) + (r.skipped||0);
              console.log(`### Playwright\n\n| Total | Passed | Failed | Flaky | Skipped |\n|---|---|---|---|---|\n| ${t} | ${r.expected} | ${r.unexpected} | ${r.flaky} | ${r.skipped} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
