name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older run (and its Neon branch is still deleted below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: '3100'
      BASE_URL: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A throwaway copy of the parent database, deleted at the end. The tests write real rows
      # (accounts, orders, stock changes); none of it touches the parent.
      - name: Branch expiry time
        id: expiry
        run: echo "at=$(date -u -d '+3 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Empty = the project's default branch. Set repo variable NEON_PARENT_BRANCH to a stable branch (e.g. ci-base).
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ vars.NEON_DB_NAME || 'neondb' }}
          role: ${{ vars.NEON_DB_ROLE || 'neondb_owner' }}
          # Safety net: Neon removes the branch itself if the run is killed before the delete step.
          expires_at: ${{ steps.expiry.outputs.at }}

      - run: npm run build

      - name: Start the app
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          node server/index.js --prod > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs "$BASE_URL/api/health" >/dev/null && exit 0
            sleep 1
          done
          echo "App did not become healthy"; cat server.log; exit 1

      - name: API smoke test
        run: npm run smoke

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # BASE_URL is set, so Playwright uses the server started above instead of starting its own.
      - name: UI tests
        run: npm run e2e

      - name: Test summary
        if: always()
        run: |
          if [ -f e2e-results/results.json ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("e2e-results/results.json", "utf8")).stats;
              const t = (r.expected||0) + (r.unexpected||0) + (r.flaky||0) + (r.skipped||0);
              console.log(`### Playwright\n\n| Total | Passed | Failed | Flaky | Skipped |\n|---|---|---|---|---|\n| ${t} | ${r.expected} | ${r.unexpected} | ${r.flaky} | ${r.skipped} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
